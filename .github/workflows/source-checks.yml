name: Source and distributable-input checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: R 4.3.2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Parse every R script
        run: >-
          Rscript -e "files <- c('reproduce.R', list.files(c('src', 'tests'),
          pattern='[.]R$', recursive=TRUE, full.names=TRUE));
          invisible(lapply(unique(files), parse));
          cat('Parsed', length(files), 'R scripts successfully\n')"
      - name: Check the one-command interface
        run: Rscript reproduce.R --help
      - name: Verify distributable public inputs
        run: Rscript src/scripts/00_verify_inputs.R --config config/config.example.R --public-only
      - name: Check the public source tree
        run: Rscript src/scripts/06_validate_release.R --source-only
      - name: Audit the proprietary-data boundary and Git history
        run: Rscript src/scripts/07_audit_public_tree.R
      - name: Run the synthetic integration test
        run: Rscript reproduce.R --synthetic --cores 2 --skip-restore

  container-smoke:
    name: Pinned WSL2/Linux container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Run source checks in the pinned R 4.3.2 image
        run: ./run-container.sh --source-tests
      - name: Run the synthetic pipeline in the pinned R 4.3.2 image
        run: ./run-container.sh --synthetic --cores 2
